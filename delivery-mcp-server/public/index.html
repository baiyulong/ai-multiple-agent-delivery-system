<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 交付任务看板</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header">
    <div class="header-inner">
      <div class="header-brand" id="header-brand">
        <svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 2L2 7l10 5 10-5-10-5z"/>
          <path d="M2 17l10 5 10-5"/>
          <path d="M2 12l10 5 10-5"/>
        </svg>
        <h1 class="brand-title">AI 交付任务看板</h1>
      </div>
      <div class="header-team" id="header-team"></div>
      <div class="header-status" id="header-status"></div>
    </div>
  </header>

  <div class="team-banner hidden" id="team-banner">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
      <path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/>
      <line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>
    </svg>
    <span id="team-banner-msg">项目未配置团队信息，请通过 MCP 调用 team.set 配置（姓名/邮箱/角色）后再创建任务。</span>
  </div>

  <main class="app-main">
    <!-- 视图切换标签（列表 / 公共文档） -->
    <nav class="view-tabs" id="view-tabs">
      <button class="tab-btn active" data-view="list" onclick="App.navigateToList()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
          <line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/>
          <line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/>
        </svg>
        任务列表
      </button>
      <button class="tab-btn" data-view="documents" onclick="App.navigateToDocuments()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
          <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/>
          <polyline points="14 2 14 8 20 8"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="16" y2="17"/>
        </svg>
        公共文档
      </button>
    </nav>

    <!-- 任务列表视图 -->
    <section id="view-list" class="view active">
      <div class="view-header">
        <h2 class="view-title">任务列表</h2>
        <span class="task-count" id="task-count"></span>
      </div>
      <div id="task-list-container" class="task-list">
        <div class="loading-state" id="list-loading">
          <div class="spinner"></div>
          <span>加载任务列表...</span>
        </div>
        <div class="error-state hidden" id="list-error">
          <svg class="error-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/>
          </svg>
          <p id="list-error-msg">加载失败</p>
          <button class="btn btn-sm" onclick="App.loadTaskList()">重试</button>
        </div>
        <div class="empty-state hidden" id="list-empty">
          <svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="9" y1="9" x2="15" y2="15"/><line x1="15" y1="9" x2="9" y2="15"/>
          </svg>
          <p>暂无任务</p>
        </div>
      </div>
    </section>

    <!-- 任务详情视图 -->
    <section id="view-detail" class="view">
      <div class="view-header">
        <button class="btn btn-back" id="btn-back" onclick="App.navigateToList()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
            <polyline points="15 18 9 12 15 6"/>
          </svg>
          返回列表
        </button>
        <button class="btn btn-sm" id="btn-refresh-detail" onclick="App.refreshDetail()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14">
            <polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/>
            <path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/>
          </svg>
          刷新
        </button>
      </div>

      <div class="loading-state hidden" id="detail-loading">
        <div class="spinner"></div>
        <span>加载任务详情...</span>
      </div>
      <div class="error-state hidden" id="detail-error">
        <svg class="error-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/>
        </svg>
        <p id="detail-error-msg">加载失败</p>
        <button class="btn btn-sm" onclick="App.loadTaskDetail()">重试</button>
      </div>

      <div id="detail-content" class="hidden">
        <!-- 基本信息 -->
        <div class="card" id="card-basic">
          <div class="card-header">
            <h2 class="card-title" id="detail-title"></h2>
            <span class="badge" id="detail-status"></span>
          </div>
          <div class="card-body">
            <p class="detail-desc" id="detail-desc"></p>
            <div class="meta-grid">
              <div class="meta-item">
                <span class="meta-label">任务 ID</span>
                <span class="meta-value mono" id="detail-id"></span>
              </div>
              <div class="meta-item">
                <span class="meta-label">类型</span>
                <span class="meta-value" id="detail-type"></span>
              </div>
              <div class="meta-item">
                <span class="meta-label">创建时间</span>
                <span class="meta-value" id="detail-created"></span>
              </div>
              <div class="meta-item">
                <span class="meta-label">更新时间</span>
                <span class="meta-value" id="detail-updated"></span>
              </div>
            </div>
          </div>
        </div>

        <!-- 阶段进度 -->
        <div class="card" id="card-stages">
          <div class="card-header">
            <h2 class="card-title">阶段进度</h2>
          </div>
          <div class="card-body">
            <div class="stage-progress" id="stage-progress"></div>
          </div>
        </div>

        <!-- 门禁摘要 -->
        <div class="card hidden" id="card-gates">
          <div class="card-header">
            <h2 class="card-title">门禁摘要</h2>
          </div>
          <div class="card-body">
            <div class="gate-grid" id="gate-grid"></div>
          </div>
        </div>

        <!-- 交付物 -->
        <div class="card hidden" id="card-artifacts">
          <div class="card-header">
            <h2 class="card-title">交付物</h2>
          </div>
          <div class="card-body">
            <div class="artifact-list" id="artifact-list"></div>
          </div>
        </div>

        <!-- 问题 -->
        <div class="card hidden" id="card-questions">
          <div class="card-header">
            <h2 class="card-title">待确认问题</h2>
          </div>
          <div class="card-body">
            <div class="question-list" id="question-list"></div>
          </div>
        </div>

        <!-- 共享上下文 -->
        <div class="card hidden" id="card-context">
          <div class="card-header">
            <h2 class="card-title">共享上下文</h2>
            <button class="btn btn-sm btn-toggle" id="btn-toggle-context" onclick="App.toggleContext()">展开</button>
          </div>
          <div class="card-body collapsible" id="context-body">
            <div class="markdown-body" id="context-content"></div>
          </div>
        </div>

        <!-- 交付包 -->
        <div class="card hidden" id="card-delivery">
          <div class="card-header">
            <h2 class="card-title">交付包</h2>
          </div>
          <div class="card-body">
            <button class="btn btn-primary" id="btn-view-delivery" onclick="App.loadDeliveryPackage()">查看交付包</button>
            <div class="hidden" id="delivery-content">
              <div class="markdown-body" id="delivery-markdown"></div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- 公共文档视图 -->
    <section id="view-documents" class="view">
      <div class="view-header">
        <h2 class="view-title">公共文档</h2>
        <span class="task-count" id="documents-count"></span>
      </div>
      <div id="documents-list" class="documents-list">
        <div class="loading-state" id="documents-loading">
          <div class="spinner"></div>
          <span>加载公共文档...</span>
        </div>
        <div class="error-state hidden" id="documents-error">
          <svg class="error-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/>
          </svg>
          <p id="documents-error-msg">加载失败</p>
          <button class="btn btn-sm" onclick="App.loadDocuments()">重试</button>
        </div>
        <div class="empty-state hidden" id="documents-empty">
          <svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/>
            <polyline points="14 2 14 8 20 8"/>
          </svg>
          <p>暂无公共文档</p>
        </div>
      </div>
    </section>
  </main>

  <footer class="app-footer">
    <span>AI 交付任务看板</span>
  </footer>

  <script src="app.js"></script>
</body>
</html>
